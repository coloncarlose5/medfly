name: Med-Fly Auto Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run Med-Fly Sync
        run: |
          python3 << 'PYEOF'
          import requests, json, os

          AWISH_TOKEN = os.environ.get('AWISH_TOKEN', '')
          VT_SESSION  = os.environ.get('VT_SESSION', '')
          OS_APP_ID   = 'e98b741b-c6c7-49f2-8bd5-fdee8b8711d4'
          OS_API_KEY  = os.environ.get('OS_API_KEY', '')

          agotados = []

          # ── AWISH SYNC ────────────────────────────────────────────────
          if AWISH_TOKEN:
              print("Syncing Awish...")
              headers = {'Authorization': f'Bearer {AWISH_TOKEN}', 'Accept': 'application/json'}
              
              page, all_items = 1, []
              while True:
                  r = requests.get(
                      f'https://s.awish.com.cn/sapi/replenishment/outStock?page={page}&type=&limit=100',
                      headers=headers, timeout=15
                  )
                  data = r.json().get('data', [])
                  if not data: break
                  all_items.extend(data)
                  if len(data) < 100: break
                  page += 1

              for item in all_items:
                  out = int(item.get('out_goods_count', 0))
                  rate = float(item.get('out_rate', '0%').replace('%', '')) / 100
                  cap = round(out / rate) if rate > 0 else 10
                  stock = max(0, cap - out)
                  if stock == 0:
                      agotados.append({
                          'machine': item.get('machine_name', ''),
                          'product': item.get('goods_name', '')
                      })

              print(f"Awish: {len(all_items)} products, {len(agotados)} agotados")

          # ── VENDINGTRACKER SYNC ───────────────────────────────────────
          if VT_SESSION:
              print("Syncing VendingTracker...")
              try:
                  vt_r = requests.post(
                      'https://beta.vendingtracker.com/Operating/Inventorycontrol/machineStockDetail',
                      headers={
                          'Cookie': f'think_var=en-us; PHPSESSID={VT_SESSION}',
                          'Content-Type': 'application/x-www-form-urlencoded',
                          'X-Requested-With': 'XMLHttpRequest'
                      },
                      data='machineId=38348&cdKey=17875064426001&nickName=Med-Fly%20Inter&aisleWarn=30',
                      timeout=15
                  )
                  vt_data = vt_r.json()
                  vt_items = vt_data.get('data', vt_data.get('list', []))
                  for item in vt_items:
                      prod = item.get('ingredientName') or item.get('productName') or item.get('name', 'Producto')
                      stock_str = str(item.get('stockQuantity') or item.get('stock') or '0/10')
                      parts = stock_str.split('/')
                      stock = int(parts[0]) if parts else 0
                      if stock == 0:
                          agotados.append({'machine': 'Med-Fly Inter', 'product': prod})
                  print(f"VendingTracker: {len(vt_items)} products")
              except Exception as e:
                  print(f"VendingTracker error: {e}")

          # ── SEND NOTIFICATIONS ────────────────────────────────────────
          if agotados and OS_API_KEY:
              print(f"Sending {len(agotados)} notifications...")
              for item in agotados[:10]:  # Max 10 notifications
                  payload = {
                      'app_id': OS_APP_ID,
                      'included_segments': ['All'],
                      'headings': {'en': '🔴 Producto Agotado — Med-Fly'},
                      'contents': {'en': f"{item['product']} en {item['machine']} está a 0"},
                      'url': 'https://coloncarlose5.github.io/medfly'
                  }
                  r = requests.post(
                      'https://onesignal.com/api/v1/notifications',
                      headers={
                          'Authorization': f'os_v2_app_{OS_API_KEY}' if not OS_API_KEY.startswith('os_') else OS_API_KEY,
                          'Content-Type': 'application/json'
                      },
                      json=payload,
                      timeout=10
                  )
                  print(f"Notification sent: {r.status_code} - {item['product']} @ {item['machine']}")

          if not agotados:
              print("✅ No agotados — all good!")

          print("Sync complete.")
          PYEOF
        env:
          AWISH_TOKEN: ${{ secrets.AWISH_TOKEN }}
          VT_SESSION: ${{ secrets.VT_SESSION }}
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
